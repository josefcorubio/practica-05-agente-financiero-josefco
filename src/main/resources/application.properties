spring.application.name=05_agente_financiero
server.port=8005

# Ollama local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=8192

# Reintentos ante fallos del modelo
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s

# MySQL local (puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/Finanzas_Data
spring.datasource.username=root
spring.datasource.password=
